<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive MLP Training Visualization</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0f0f1a;
        color: #e0e0f0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }
    .container { max-width: 1200px; width: 100%; }
    h1 {
        text-align: center;
        font-weight: 300;
        font-size: 28px;
        margin-bottom: 6px;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .subtitle {
        text-align: center;
        color: #8899bb;
        font-size: 14px;
        margin-bottom: 20px;
    }
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid #2a2a4a;
    }
    .card h3 {
        font-size: 14px;
        font-weight: 500;
        color: #99aacd;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    canvas {
        display: block;
        width: 100%;
        border-radius: 8px;
        background: #12121e;
    }
    #networkCanvas, #dataCanvas { aspect-ratio: 1 / 1; }
    .controls {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 16px 20px;
        border: 1px solid #2a2a4a;
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
    }
    .controls label {
        font-size: 13px;
        color: #99aacd;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .controls input[type="range"] {
        width: 120px;
        accent-color: #60a5fa;
        background: #2a2a4a;
        height: 4px;
        border-radius: 2px;
    }
    .controls input[type="checkbox"] { accent-color: #60a5fa; }
    .controls button {
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        border: none;
        color: white;
        padding: 7px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: transform 0.15s, box-shadow 0.15s;
    }
    .controls button:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(96,165,250,0.3);
    }
    .controls button:active { transform: translateY(0); }
    .controls button.secondary {
        background: #2a2a4a;
        color: #c0c0e0;
    }
    .controls button.secondary:hover { background: #3a3a5a; box-shadow: none; }
    .info-panel {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        font-size: 13px;
        color: #8899bb;
    }
    .info-panel .stat {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .info-panel .stat span {
        color: #e0e0f0;
        font-weight: 500;
        min-width: 30px;
    }
    .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;

    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .legend-line { width: 20px; height: 2px; display: inline-block; }
    #geomLabel { color: #fbbf24; font-weight: 500; }
    .bottom-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        margin-top: 16px;
    }
    .log-card {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid #2a2a4a;
        max-height: 140px;
        overflow-y: auto;
    }
    .log-card h3 {
        font-size: 13px;
        font-weight: 500;
        color: #99aacd;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .log-card .log-entry {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 11px;
        color: #66bbaa;
        line-height: 1.5;
        opacity: 0.85;
    }
    .log-card .log-entry.error { color: #f87171; }
    .log-card .log-entry .dim { color: #556688; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 2px; }
    @media (max-width: 800px) {
        .main-grid { grid-template-columns: 1fr; }
        .bottom-row { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>🧠 MLP Training Visualizer</h1>
    <p class="subtitle">Multi-Layer Perceptron &middot; 2 → 8 → 8 → 1 &middot; Binary Classification</p>

    <div class="main-grid">
        <div class="card">
            <h3>📊 Decision Boundary</h3>
            <canvas id="dataCanvas" width="500" height="500"></canvas>
            <div class="legend" style="margin-top:8px">
                <span class="legend-item"><span class="legend-dot" style="background:#f87171"></span> Class A</span>
                <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span> Class B</span>
                <span class="legend-item" id="geomLabel">🌐 <span></span></span>
            </div>
        </div>
        <div class="card">
            <h3>🔗 Network Graph</h3>
            <canvas id="networkCanvas" width="500" height="500"></canvas>
        </div>
    </div>

    <div class="controls">
        <button id="playBtn">▶ Play</button>
        <button id="stepBtn" class="secondary">⏭ Step</button>
        <button id="resetBtn" class="secondary">↺ Reset</button>
        <label>Speed <input type="range" id="speedRange" min="1" max="20" value="5"></label>
        <label>LR <input type="range" id="lrRange" min="0.01" max="1.5" step="0.01" value="0.3"></label>
        <label><input type="checkbox" id="drawWeights" checked> Show weights</label>
        <div class="info-panel">
            <span class="stat">Epoch <span id="epochDisplay">0</span></span>
            <span class="stat">Loss <span id="lossDisplay">—</span></span>
            <span class="stat">Acc <span id="accDisplay">—</span></span>
        </div>
    </div>

    <div class="bottom-row">
        <div class="log-card" id="logCard">
            <h3>📜 Training Log</h3>
            <div id="logContainer"></div>
        </div>
        <div class="card" style="display:flex;flex-direction:column;gap:6px;min-width:200px">
            <h3>⚙️ Data Options</h3>
            <label>Points <input type="range" id="pointCount" min="20" max="200" value="80" style="width:80px"></label>
            <select id="geomSelect" style="background:#2a2a4a;color:#e0e0f0;border:1px solid #3a3a5a;border-radius:4px;padding:4px 8px;width:100%">
                <option value="random">🎲 Random</option>
                <option value="circle">⭕ Circle</option>
                <option value="sine">〰️ Sine</option>
                <option value="quadrant">🔲 Quadrant</option>
                <option value="checkerboard">🏁 Checkerboard</option>
            </select>
            <button id="regenerateBtn" class="secondary" style="width:100%">🎲 Regenerate Data</button>
        </div>
    </div>
</div>

<script>
// ===== MATH UTILS =====
function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }
function sigmoidDeriv(x) { const s = sigmoid(x); return s * (1 - s); }
function tanh_(x) { return Math.tanh(x); }
function tanhDeriv(x) { const t = Math.tanh(x); return 1 - t * t; }
function relu(x) { return Math.max(0, x); }

function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

// ===== NETWORK: 2 → 8 → 8 → 1 (bigger, more expressive) =====
class MLP {
    constructor() {
        this.layers = [
            { w: this.randMat(8, 2), b: this.randVec(8) },
            { w: this.randMat(8, 8), b: this.randVec(8) },
            { w: this.randMat(1, 8), b: this.randVec(1) }
        ];
        this.activations = [];
        this.zs = [];
    }

    randMat(rows, cols) {
        const m = [];
        for (let r = 0; r < rows; r++) {
            m[r] = [];
            for (let c = 0; c < cols; c++) m[r][c] = randn() * Math.sqrt(2 / cols);
        }
        return m;
    }
    randVec(n) { const v = []; for (let i = 0; i < n; i++) v[i] = randn() * 0.1; return v; }

    forward(x) {
        this.activations = [x];
        this.zs = [];
        for (let l = 0; l < this.layers.length; l++) {
            const { w, b } = this.layers[l];
            const aPrev = this.activations[l];
            const z = [];
            for (let j = 0; j < w.length; j++) {
                let sum = b[j];
                for (let k = 0; k < w[j].length; k++) sum += w[j][k] * aPrev[k];
                z[j] = sum;
            }
            this.zs.push(z);
            let a;
            if (l === this.layers.length - 1) {
                a = [sigmoid(z[0])];
            } else {
                a = z.map(v => tanh_(v));
            }
            this.activations.push(a);
        }
        return this.activations[this.activations.length - 1][0];
    }

    backward(y) {
        const L = this.layers.length;
        const yHat = this.activations[L][0];
        const dZ = [(yHat - y) * sigmoidDeriv(this.zs[L-1][0])];

        const dW = [];
        const dB = [];

        dW[L-1] = [];
        dB[L-1] = [];
        for (let j = 0; j < this.layers[L-1].w.length; j++) {
            dB[L-1][j] = dZ[j];
            dW[L-1][j] = [];
            for (let k = 0; k < this.layers[L-1].w[j].length; k++) {
                dW[L-1][j][k] = dZ[j] * this.activations[L-1][k];
            }
        }

        for (let l = L - 2; l >= 0; l--) {
            const nextW = this.layers[l+1].w;
            const dZCurr = [];
            for (let j = 0; j < this.layers[l].w.length; j++) {
                let sum = 0;
                for (let k = 0; k < nextW.length; k++) {
                    sum += nextW[k][j] * (dZ[k] || 0);
                }
                dZCurr[j] = sum * tanhDeriv(this.zs[l][j]);
            }
            dZ.length = 0;
            dZ.push(...dZCurr);

            dW[l] = [];
            dB[l] = [];
            for (let j = 0; j < this.layers[l].w.length; j++) {
                dB[l][j] = dZ[j];
                dW[l][j] = [];
                for (let k = 0; k < this.layers[l].w[j].length; k++) {
                    dW[l][j][k] = dZ[j] * this.activations[l][k];
                }
            }
        }
        return { dW, dB };
    }

    update(grads, lr) {
        for (let l = 0; l < this.layers.length; l++) {
            for (let j = 0; j < this.layers[l].w.length; j++) {
                this.layers[l].b[j] -= lr * grads.dB[l][j];
                for (let k = 0; k < this.layers[l].w[j].length; k++) {
                    this.layers[l].w[j][k] -= lr * grads.dW[l][j][k];
                }
            }
        }
    }

    predict(x) { return this.forward(x); }
}

// ===== DATA GENERATION — multiple geometries =====

// Returns { data, geomName, boundaryFn } where boundaryFn(x,y) → 1 (red) or 0 (blue)
function pickGeometry(geomId) {
    const options = ['circle', 'sine', 'quadrant', 'checkerboard'];
    if (geomId === 'random') {
        geomId = options[Math.floor(Math.random() * options.length)];
    }
    let boundaryFn, geomName;

    switch (geomId) {
        case 'circle': {
            const cx = 0.3 + Math.random() * 0.4;
            const cy = 0.3 + Math.random() * 0.4;
            const r = 0.2 + Math.random() * 0.22;
            geomName = `circle (c=${cx.toFixed(2)},${cy.toFixed(2)}, r=${r.toFixed(2)})`;
            boundaryFn = (x, y) => {
                const dx = x - cx, dy = y - cy;
                return Math.sqrt(dx*dx + dy*dy) <= r ? 1 : 0;
            };
            break;
        }
        case 'sine': {
            const freq = 2 + Math.random() * 3;
            const amp = 0.1 + Math.random() * 0.15;
            const phase = Math.random() * 2 * Math.PI;
            geomName = `sine (f=${freq.toFixed(1)}, a=${amp.toFixed(2)})`;
            boundaryFn = (x, y) => {
                const waveY = 0.5 + amp * Math.sin(freq * (x - 0.5) * 2 * Math.PI + phase);
                return y <= waveY ? 1 : 0;
            };
            break;
        }
        case 'quadrant': {
            const splitX = 0.3 + Math.random() * 0.4;
            const splitY = 0.3 + Math.random() * 0.4;
            geomName = `quadrant (x=${splitX.toFixed(2)}, y=${splitY.toFixed(2)})`;
            boundaryFn = (x, y) => (x <= splitX && y <= splitY) || (x > splitX && y > splitY) ? 1 : 0;
            break;
        }
        case 'checkerboard': {
            const cells = 2 + Math.floor(Math.random() * 2); // 2 or 3
            geomName = `checkerboard (${cells}x${cells})`;
            boundaryFn = (x, y) => {
                const ix = Math.floor(x * cells);
                const iy = Math.floor(y * cells);
                return (ix + iy) % 2 === 0 ? 1 : 0;
            };
            break;
        }
        default: {
            // fallback circle
            geomName = 'circle (fallback)';
            boundaryFn = (x, y) => {
                const dx = x - 0.5, dy = y - 0.5;
                return Math.sqrt(dx*dx + dy*dy) <= 0.38 ? 1 : 0;
            };
        }
    }
    return { geomName, boundaryFn };
}

function generateData(n, geomId) {
    const { geomName, boundaryFn } = pickGeometry(geomId);
    const data = [];
    const half = Math.floor(n / 2);
    let attempts = 0;
    const maxAttempts = n * 100;

    // Generate balanced classes by rejection sampling
    const counts = { 0: 0, 1: 0 };
    const targetPerClass = half;

    while ((counts[0] < targetPerClass || counts[1] < targetPerClass) && attempts < maxAttempts) {
        attempts++;
        const x = 0.02 + Math.random() * 0.96;
        const y = 0.02 + Math.random() * 0.96;
        const label = boundaryFn(x, y);
        if (counts[label] < targetPerClass) {
            const nx = x + (Math.random() - 0.5) * 0.04;
            const ny = y + (Math.random() - 0.5) * 0.04;
            data.push({ x: Math.max(0.01, Math.min(0.99, nx)), y: Math.max(0.01, Math.min(0.99, ny)), label });
            counts[label]++;
        }
    }

    // Fill any remaining
    while (data.length < n && attempts < maxAttempts) {
        attempts++;
        const x = 0.02 + Math.random() * 0.96;
        const y = 0.02 + Math.random() * 0.96;
        const label = boundaryFn(x, y);
        const nx = x + (Math.random() - 0.5) * 0.04;
        const ny = y + (Math.random() - 0.5) * 0.04;
        data.push({ x: Math.max(0.01, Math.min(0.99, nx)), y: Math.max(0.01, Math.min(0.99, ny)), label });
    }

    // Shuffle
    for (let i = data.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [data[i], data[j]] = [data[j], data[i]];
    }

    return { data, geomName, boundaryFn };
}

// ===== RENDERING =====
const dataCanvas = document.getElementById('dataCanvas');
const dataCtx = dataCanvas.getContext('2d');
const netCanvas = document.getElementById('networkCanvas');
const netCtx = netCanvas.getContext('2d');

let mlp = new MLP();
let dataState = generateData(80, 'random');
let data = dataState.data;
let boundaryFn = dataState.boundaryFn;
let geomName = dataState.geomName;
let epoch = 0;
let loss = 0;
let accuracy = 0;
let running = false;
let animId = null;
let logs = [];
const MAX_LOGS = 50;

function log(msg, type = '') {
    logs.push({ msg, type, epoch });
    if (logs.length > MAX_LOGS) logs.shift();
    const container = document.getElementById('logContainer');
    container.innerHTML = logs.map(l =>
        `<div class="log-entry ${l.type}"><span class="dim">[${l.epoch}]</span> ${l.msg}</div>`
    ).join('');
    container.parentElement.scrollTop = container.parentElement.scrollHeight;
}

function drawData() {
    const w = dataCanvas.width, h = dataCanvas.height;
    const ctx = dataCtx;
    const pad = 40;
    const pw = w - 2 * pad, ph = h - 2 * pad;

    ctx.clearRect(0, 0, w, h);

    // Evaluate MLP on a grid
    const gridRes = 60;
    const gridVals = [];
    for (let gi = 0; gi < gridRes; gi++) {
        gridVals[gi] = [];
        for (let gj = 0; gj < gridRes; gj++) {
            const px = gj / (gridRes - 1);
            const py = 1 - gi / (gridRes - 1);
            gridVals[gi][gj] = mlp.predict([px, py]);
        }
    }

    // Draw heatmap
    const imgData = ctx.createImageData(w, h);
    for (let yi = 0; yi < h; yi++) {
        for (let xi = 0; xi < w; xi++) {
            const px = (xi - pad) / pw;
            const py = 1 - (yi - pad) / ph;
            if (px < 0 || px > 1 || py < 0 || py > 1) {
                const idx = (yi * w + xi) * 4;
                imgData.data[idx] = 15; imgData.data[idx+1] = 15; imgData.data[idx+2] = 30; imgData.data[idx+3] = 255;
                continue;
            }
            const gx = px * (gridRes - 1);
            const gy = (1 - py) * (gridRes - 1);
            const ix = Math.floor(gx), iy = Math.floor(gy);
            const fx = gx - ix, fy = gy - iy;
            const ix1 = Math.min(ix + 1, gridRes - 1), iy1 = Math.min(iy + 1, gridRes - 1);
            const v00 = gridVals[iy][ix];
            const v10 = gridVals[iy][ix1];
            const v01 = gridVals[iy1][ix];
            const v11 = gridVals[iy1][ix1];
            const v = v00*(1-fx)*(1-fy) + v10*fx*(1-fy) + v01*(1-fx)*fy + v11*fx*fy;

            const idx = (yi * w + xi) * 4;
            const r = v * 180 + 40;
            const g = 30 + (1 - Math.abs(v - 0.5) * 2) * 40;
            const b = (1 - v) * 180 + 40;
            imgData.data[idx] = Math.round(r);
            imgData.data[idx+1] = Math.round(g);
            imgData.data[idx+2] = Math.round(b);
            imgData.data[idx+3] = 255;
        }
    }
    ctx.putImageData(imgData, 0, 0);

    // Draw data points
    for (const d of data) {
        const sx = pad + d.x * pw;
        const sy = pad + (1 - d.y) * ph;
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, 2 * Math.PI);
        ctx.fillStyle = d.label === 1 ? '#f87171' : '#60a5fa';
        ctx.fill();
        ctx.strokeStyle = d.label === 1 ? '#ef4444' : '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    // Labels
    ctx.fillStyle = '#556688';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('x₁', pad + pw/2, h - 8);
    ctx.save();
    ctx.translate(12, pad + ph/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('x₂', 0, 0);
    ctx.restore();
}

// Shared between drawNetwork and the mouseover handler
let netEdgeData = [];     // [{ l, fromIdx, toIdx, weight }]
let netNeuronPositions = []; // positions[l][j] = {x, y}

function drawNetwork() {
    const w = netCanvas.width, h = netCanvas.height;
    const ctx = netCtx;
    ctx.clearRect(0, 0, w, h);

    const layerSizes = [2, 8, 8, 1];
    const numLayers = layerSizes.length;
    const layerSpacing = w / (numLayers + 1);

    // Neuron positions
    const positions = [];
    for (let l = 0; l < numLayers; l++) {
        const n = layerSizes[l];
        const x = layerSpacing * (l + 1);
        const spacing = h / (n + 1);
        const pos = [];
        for (let j = 0; j < n; j++) pos.push({ x, y: spacing * (j + 1) });
        positions.push(pos);
    }
    netNeuronPositions = positions;

    const showWeights = document.getElementById('drawWeights').checked;
    netEdgeData = [];

    // Edges
    for (let l = 0; l < numLayers - 1; l++) {
        const from = positions[l];
        const to = positions[l + 1];
        const wMat = mlp.layers[l].w;
        let maxW = 0;
        for (let j = 0; j < wMat.length; j++)
            for (let k = 0; k < wMat[j].length; k++)
                maxW = Math.max(maxW, Math.abs(wMat[j][k]));
        if (maxW === 0) maxW = 1;

        for (let j = 0; j < from.length; j++) {
            for (let k = 0; k < to.length; k++) {
                const weight = wMat[k][j];
                netEdgeData.push({ l, fromIdx: j, toIdx: k, weight,
                    x1: from[j].x, y1: from[j].y,
                    x2: to[k].x, y2: to[k].y });
                const intensity = Math.abs(weight) / maxW;
                const alpha = 0.08 + intensity * 0.6;
                ctx.beginPath();
                ctx.moveTo(from[j].x, from[j].y);
                ctx.lineTo(to[k].x, to[k].y);
                if (showWeights) {
                    ctx.strokeStyle = weight > 0
                        ? `rgba(96, 165, 250, ${alpha})`
                        : `rgba(248, 113, 113, ${alpha})`;
                    ctx.lineWidth = 0.3 + intensity * 1.8;
                } else {
                    ctx.strokeStyle = `rgba(100, 100, 150, 0.1)`;
                    ctx.lineWidth = 0.4;
                }
                ctx.stroke();
            }
        }
    }

    const activations = mlp.activations.length > 0 ? mlp.activations : null;

    // Nodes
    for (let l = 0; l < numLayers; l++) {
        const n = layerSizes[l];
        for (let j = 0; j < n; j++) {
            const p = positions[l][j];
            let actVal = 0.5;
            if (activations && activations[l] !== undefined && activations[l][j] !== undefined) {
                actVal = activations[l][j];
            }

            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
            const r = Math.round(40 + actVal * 180);
            const g = Math.round(30 + (1 - Math.abs(actVal - 0.5) * 2) * 100);
            const b = Math.round(40 + (1 - actVal) * 180);
            grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.9)`);
            grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.5)`);
            grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 16, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(p.x, p.y, 7, 0, 2 * Math.PI);
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255,0.15)`;
            ctx.lineWidth = 0.8;
            ctx.stroke();

            if (l === 0) {
                ctx.fillStyle = '#8899bb';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`x${j+1}`, p.x + 12, p.y + 3);
            } else if (l === numLayers - 1) {
                const val = activations ? activations[l][0].toFixed(3) : '';
                ctx.fillStyle = '#fbbf24';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`ŷ = ${val}`, p.x + 12, p.y + 3);
            }
        }
    }

    // Layer labels
    const labels = ['Input (2)', 'Hidden (8)', 'Hidden (8)', 'Output (1)'];
    for (let l = 0; l < numLayers; l++) {
        ctx.fillStyle = '#556688';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(labels[l], positions[l][0].x, 12);
    }
}

function updateStats() {
    document.getElementById('epochDisplay').textContent = epoch;
    document.getElementById('lossDisplay').textContent = loss.toFixed(4);
    document.getElementById('accDisplay').textContent = (accuracy * 100).toFixed(1) + '%';
    const gl = document.getElementById('geomLabel');
    if (gl) gl.innerHTML = '🌐 ' + geomName;
}

function trainStep() {
    const shuffled = [...data];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const lr = parseFloat(document.getElementById('lrRange').value);
    let totalLoss = 0;
    let correct = 0;

    for (const d of shuffled) {
        const pred = mlp.forward([d.x, d.y]);
        const grads = mlp.backward(d.label);
        mlp.update(grads, lr);

        const eps = 1e-12;
        totalLoss += -(d.label * Math.log(Math.max(pred, eps)) + (1 - d.label) * Math.log(Math.max(1 - pred, eps)));
        correct += (pred >= 0.5) === (d.label === 1) ? 1 : 0;
    }

    loss = totalLoss / data.length;
    accuracy = correct / data.length;
    epoch++;

    if (epoch === 1 || epoch % 10 === 0 || epoch % 25 === 0) {
        log(`loss=${loss.toFixed(4)}  acc=${(accuracy*100).toFixed(1)}%  lr=${lr.toFixed(2)}`);
    }

    updateStats();
    drawData();
    drawNetwork();
}

function resetAll() {
    mlp = new MLP();
    epoch = 0;
    loss = 0;
    accuracy = 0;
    logs = [];
    document.getElementById('logContainer').innerHTML = '';
    log('Network reset, starting fresh...');
    updateStats();
    drawData();
    drawNetwork();
}

function regenerateData() {
    const n = parseInt(document.getElementById('pointCount').value);
    const geomId = document.getElementById('geomSelect').value;
    dataState = generateData(n, geomId);
    data = dataState.data;
    boundaryFn = dataState.boundaryFn;
    geomName = dataState.geomName;
    log(`Regenerated ${data.length} points — ${geomName}`);
    // Reset network too so we see learning from scratch on new geometry
    mlp = new MLP();
    epoch = 0;
    loss = 0;
    accuracy = 0;
    updateStats();
    drawData();
    drawNetwork();
}

// ===== EVENT BINDING =====
const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', () => {
    running = !running;
    playBtn.textContent = running ? '⏸ Pause' : '▶ Play';
    if (running) {
        if (epoch === 0) log('Training started...');
        function step() {
            if (!running) return;
            const speed = parseInt(document.getElementById('speedRange').value);
            for (let i = 0; i < speed; i++) trainStep();
            animId = requestAnimationFrame(step);
        }
        animId = requestAnimationFrame(step);
    } else {
        if (animId) cancelAnimationFrame(animId);
    }
});

document.getElementById('stepBtn').addEventListener('click', () => {
    if (epoch === 0) log('Training started (step-by-step)...');
    trainStep();
});

document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('regenerateBtn').addEventListener('click', regenerateData);
document.getElementById('drawWeights').addEventListener('change', drawNetwork);

document.getElementById('lrRange').addEventListener('input', () => {
    document.getElementById('lossDisplay').textContent = loss.toFixed(4);
});

// ---- Network tooltip ----
const netTooltip = document.createElement('div');
netTooltip.id = 'netTooltip';
netTooltip.style.cssText = 'position:fixed;background:#1a1a2e;border:1px solid #3a3a5a;border-radius:6px;padding:4px 8px;font-size:11px;color:#e0e0f0;pointer-events:none;display:none;z-index:100;white-space:nowrap;font-family:Consolas,monospace;';
document.body.appendChild(netTooltip);

netCanvas.addEventListener('mousemove', (e) => {
    const rect = netCanvas.getBoundingClientRect();
    const scaleX = netCanvas.width / rect.width;
    const scaleY = netCanvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    // Find nearest edge within 8px
    let best = null, bestDist = 12;
    for (const ed of netEdgeData) {
        const dx = ed.x2 - ed.x1, dy = ed.y2 - ed.y1;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len < 1) continue;
        const t = Math.max(0, Math.min(1, ((mx - ed.x1)*dx + (my - ed.y1)*dy) / (len*len)));
        const px = ed.x1 + t * dx, py = ed.y1 + t * dy;
        const d = Math.sqrt((mx - px)*(mx - px) + (my - py)*(my - py));
        if (d < bestDist) { bestDist = d; best = ed; }
    }

    if (best) {
        const lyrs = ['Input→H1', 'H1→H2', 'H2→Output'];
        netTooltip.textContent = `${lyrs[best.l]}  w[${best.fromIdx}→${best.toIdx}] = ${best.weight.toFixed(4)}`;
        netTooltip.style.display = 'block';
        netTooltip.style.left = (e.clientX + 14) + 'px';
        netTooltip.style.top = (e.clientY - 10) + 'px';
        netCanvas.style.cursor = 'pointer';
    } else {
        netTooltip.style.display = 'none';
        netCanvas.style.cursor = 'default';
    }
});

netCanvas.addEventListener('mouseleave', () => {
    netTooltip.style.display = 'none';
    netCanvas.style.cursor = 'default';
});
// ---- end tooltip ----

// Init
log('MLP initialized: 2→8→8→1. Pick a geometry and click ▶');
drawData();
drawNetwork();
updateStats();

console.log('MLP Training Visualizer loaded. Network: 2→8→8→1');
</script>
